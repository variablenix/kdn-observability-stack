apiVersion: 1
providers:
  - name: reviewed-services
    orgId: 1
    folder: Services
    folderUid: services
    type: file
    disableDeletion: true
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/services
      foldersFromFilesStructure: false
