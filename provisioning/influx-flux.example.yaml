apiVersion: 1
datasources:
  - name: InfluxDB Flux
    uid: influx-flux
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    editable: false
    jsonData:
      version: Flux
      organization: example-lab
      defaultBucket: telegraf
    secureJsonData:
      # A separate read-only token for the dashboard buckets, provided privately.
      token: ${INFLUXDB_READ_TOKEN}
# Retain a separate InfluxQL source for dashboards built with InfluxQL queries.
