# Merge these into the authoritative Prometheus scrape_configs; replace examples.
# Private endpoints only. These are three different services, not interchangeable ports.
scrape_configs:
  - job_name: immich
    static_configs:
      - targets: [media.example.net:8091, media.example.net:8092]
  - job_name: node-exporters
    static_configs:
      - targets: [media.example.net:9100]
  - job_name: gobot
    scrape_interval: 30s
    static_configs:
      - targets: [irc.example.net:8082]
  - job_name: soju
    scrape_interval: 30s
    static_configs:
      - targets: [irc.example.net:18081]
  - job_name: soju-admin
    scrape_interval: 30s
    static_configs:
      - targets: [irc.example.net:18082]
    # Collector samples must include soju_instance matching native Soju's instance.
